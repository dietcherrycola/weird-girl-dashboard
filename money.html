<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Money — Weird Girl Dashboard</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="money.css">
</head>
<body>
<nav class="nav" id="main-nav"></nav>
<div class="db">
<div class="page-title">💰 Money Tracker</div>

<div class="money-summary" style="margin-top:1rem">
  <div class="money-stat"><div class="ms-label">Monthly income</div><div class="ms-val" style="color:var(--green)" id="life-school-pay">$1,005</div><div class="ms-sub" id="life-school-sub">→ $1,500 from Aug 12</div></div>
  <div class="money-stat"><div class="ms-label">Side hustle</div><div class="ms-val" style="color:var(--gold)" id="total-hustle">$0</div><div class="ms-sub">YouTube, Etsy, UGC</div></div>
  <div class="money-stat"><div class="ms-label">Beauty fund</div><div class="ms-val" style="color:var(--ch)" id="beauty-fund">$0</div><div class="ms-sub">saved toward treatments</div></div>
</div>

<div class="g2">
  <div class="card"><div class="ct"><div class="ci">💸</div>Income streams<button class="btn btn-red ct-right" id="open-income-modal" style="font-size:11px;padding:4px 10px">+ Add</button></div><div id="income-list"></div></div>
  <div class="card"><div class="ct"><div class="ci">✨</div>Beauty wishlist</div>
    <div class="row"><input class="inp" id="wish-inp" placeholder="Treatment name..." style="flex:1"><input class="inp" id="wish-cost" placeholder="$" style="width:50px"><button class="btn btn-red" id="wish-add-btn">Add</button></div>
    <div id="wish-list" style="margin-top:.5rem"></div>
  </div>
</div>
<div class="card"><div class="ct"><div class="ci">🗺</div>Financial roadmap</div><div id="money-roadmap"></div></div>

</div>

<!-- INCOME MODAL -->
<div class="mo" id="income-modal">
  <div class="modal"><div class="modal-title">Log income</div>
    <div class="fr"><label class="fl">Source</label><input class="inp inp-full" id="inc-source" placeholder="e.g. Etsy sale, brand deal..." /></div>
    <div class="fgrid2">
      <div class="fr"><label class="fl">Amount ($)</label><input class="inp inp-full" id="inc-amt" type="number" /></div>
      <div class="fr"><label class="fl">Category</label><select class="sel inp-full" id="inc-cat"><option>YouTube</option><option>Etsy</option><option>UGC / Brand deal</option><option>Freelance</option><option>Other</option></select></div>
    </div>
    <div class="macts"><button class="btn btn-outline" id="inc-cancel">Cancel</button><button class="btn btn-red" id="inc-save">Add income</button></div>
  </div>
</div>

<script type="module" src="shared.js"></script>
<script type="module" src="money.js"></script>
</body>
</html>
