<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Learning Hub — Weird Girl Dashboard</title>
<link rel="stylesheet" href="learning-hub.css">
</head>
<body>

<!-- BACK BAR -->
<div class="back-bar">
  <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
  <span class="back-title">🧠 Learning Hub</span>
</div>

<!-- MAIN HUB VIEW -->
<div id="hub-main">
<div class="hub">

<div class="hub-header">
  <h1>🧠 Learning Hub</h1>
  <div class="hub-header-sub">Master new skills · track your progress · never stop growing</div>
</div>

<!-- OVERVIEW STATS -->
<div class="overview-stats" id="overview-stats"></div>

<!-- DECAY ALERTS -->
<div id="decay-alerts"></div>

<!-- CATEGORY FILTERS -->
<div class="cat-filters" id="cat-filters">
  <button class="cat-btn active" onclick="filterCat('all',this)">All</button>
  <button class="cat-btn" onclick="filterCat('creative',this)">🎨 Creative</button>
  <button class="cat-btn" onclick="filterCat('language',this)">🌍 Languages</button>
  <button class="cat-btn" onclick="filterCat('coding',this)">💻 Coding</button>
  <button class="cat-btn" onclick="filterCat('gaming',this)">🎮 Gaming/Fandom</button>
  <button class="cat-btn" onclick="filterCat('craft',this)">🧵 Crafts & Hands-on</button>
  <button class="cat-btn" onclick="filterCat('life',this)">🍳 Life Skills</button>
</div>

<!-- PILLAR GRID -->
<div class="pillar-grid" id="pillar-grid"></div>

</div>
</div>

<!-- PILLAR DETAIL PAGES (rendered dynamically) -->
<div id="pillar-pages"></div>

<script src="learning-hub.js"></script>
</body>
</html>
