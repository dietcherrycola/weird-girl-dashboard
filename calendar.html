<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Calendar — Weird Girl Dashboard</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<nav class="nav" id="main-nav"></nav>
<div class="db" id="page-calendar">

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem">
    <div style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--chd)">📅 My Calendar</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-red" onclick="fcOpenNewEvent()">+ New event</button>
      <div style="display:flex;gap:3px;background:rgba(0,0,0,.05);border-radius:8px;padding:3px">
        <button id="fc-view-month" onclick="fcShowView('month')" style="padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:600;background:var(--ch);color:white;transition:all .15s">Month</button>
        <button id="fc-view-week" onclick="fcShowView('week')" style="padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:600;background:transparent;color:var(--tmut);transition:all .15s">Week</button>
        <button id="fc-view-agenda" onclick="fcShowView('agenda')" style="padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:600;background:transparent;color:var(--tmut);transition:all .15s">Agenda</button>
      </div>
    </div>
  </div>

  <!-- MONTH VIEW -->
  <div id="fc-month-view">
    <div class="card" style="padding:.9rem">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.9rem">
        <button class="cal-nav" onclick="fcPrev()">‹</button>
        <div style="flex:1;text-align:center;font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--chd)" id="fc-month-lbl"></div>
        <button class="cal-nav" onclick="fcNext()">›</button>
        <button onclick="fcGoToday()" style="font-size:10px;padding:5px 11px;border-radius:7px;border:1px solid var(--cbr);background:white;cursor:pointer;color:var(--chd);font-weight:600;font-family:'DM Sans',sans-serif">Today</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
        <div class="cdl">Sun</div><div class="cdl">Mon</div><div class="cdl">Tue</div>
        <div class="cdl">Wed</div><div class="cdl">Thu</div><div class="cdl">Fri</div><div class="cdl">Sat</div>
      </div>
      <div id="fc-month-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px"></div>
    </div>
  </div>

  <!-- WEEK VIEW -->
  <div id="fc-week-view" style="display:none">
    <div class="card" style="padding:.9rem">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.9rem">
        <button class="cal-nav" onclick="fcPrev()">‹</button>
        <div style="flex:1;text-align:center;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--chd)" id="fc-week-lbl"></div>
        <button class="cal-nav" onclick="fcNext()">›</button>
        <button onclick="fcGoToday()" style="font-size:10px;padding:5px 11px;border-radius:7px;border:1px solid var(--cbr);background:white;cursor:pointer;color:var(--chd);font-weight:600;font-family:'DM Sans',sans-serif">Today</button>
      </div>
      <div id="fc-week-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div>
    </div>
  </div>

  <!-- AGENDA VIEW -->
  <div id="fc-agenda-view" style="display:none">
    <div class="card" style="padding:.9rem">
      <div style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--chd);margin-bottom:.8rem">Upcoming events</div>
      <div id="fc-agenda-list"></div>
      <div id="fc-agenda-empty" style="font-size:11px;color:var(--tmut);font-style:italic;text-align:center;padding:2rem">No upcoming events — add one! 🗓️</div>
    </div>
  </div>

  <!-- DAY PANEL -->
  <div id="fc-day-panel" style="display:none;margin-top:.8rem">
    <div class="card" style="padding:.9rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;flex-wrap:wrap;gap:6px">
        <div style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--chd)" id="fc-day-title"></div>
        <button class="btn btn-red" style="font-size:10px;padding:5px 11px" onclick="fcOpenNewEventOnDay()">+ Add event</button>
      </div>
      <div id="fc-day-events"></div>
      <div id="fc-day-empty" style="font-size:11px;color:var(--tmut);font-style:italic;padding:.5rem 0">Nothing on this day — add something!</div>
    </div>
  </div>

  <!-- EVENT MODAL -->
  <div class="mo" id="fc-event-modal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal" style="max-width:460px">
      <div class="modal-title" id="fc-modal-title">✨ New event</div>

      <div class="fr">
        <label class="fl">Event name *</label>
        <input class="inp inp-full" id="fc-ev-name" placeholder="What's happening?">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.6rem">
        <div>
          <label class="fl">Date *</label>
          <input class="inp inp-full" id="fc-ev-date" type="date">
        </div>
        <div>
          <label class="fl">End date <span style="opacity:.5;font-size:9px">(optional)</span></label>
          <input class="inp inp-full" id="fc-ev-end-date" type="date">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.6rem">
        <div>
          <label class="fl">Time <span style="opacity:.5;font-size:9px">(optional)</span></label>
          <input class="inp inp-full" id="fc-ev-time" type="time">
        </div>
        <div>
          <label class="fl">Category</label>
          <select class="inp inp-full" id="fc-ev-cat">
            <option value="personal">🌸 Personal</option>
            <option value="health">🩺 Health</option>
            <option value="school">📚 School</option>
            <option value="work">💼 Work / Barbie</option>
            <option value="social">👯 Social</option>
            <option value="birthday">🎂 Birthday</option>
            <option value="reminder">⏰ Reminder</option>
            <option value="other">📌 Other</option>
          </select>
        </div>
      </div>

      <div class="fr">
        <label class="fl">Colour</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap;padding:.2rem 0" id="fc-color-picker">
          <div class="fc-color-swatch selected" data-color="#930500" style="background:#930500" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#e07b10" style="background:#e07b10" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#5C0300" style="background:#5C0300" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#4A6FA5" style="background:#4A6FA5" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#4A6FA5" style="background:#4A6FA5" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#5C0300" style="background:#5C0300" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#930500" style="background:#930500" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#1a5fa0" style="background:#1a5fa0" onclick="fcPickColor(this)"></div>
          <div class="fc-color-swatch" data-color="#555" style="background:#555" onclick="fcPickColor(this)"></div>
        </div>
      </div>

      <div class="fr">
        <label class="fl">Repeat</label>
        <select class="inp inp-full" id="fc-ev-recur" onchange="fcToggleRecurDays()">
          <option value="none">No repeat</option>
          <option value="daily">Every day</option>
          <option value="custom">Custom — pick days &amp; interval</option>
          <option value="monthly">Every month (same date)</option>
          <option value="yearly">Every year (same date)</option>
        </select>
      </div>
      <!-- Custom repeat picker -->
      <div id="fc-recur-days-wrap" style="display:none;margin-bottom:.6rem;background:var(--chp);border-radius:10px;padding:.6rem .8rem;border:1px solid rgba(192,57,43,.15)">
        <div style="font-size:9px;font-weight:700;color:var(--chd);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.4px">On these days of the week</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.6rem">
          <label class="fc-day-chip"><input type="checkbox" value="0" id="fc-rd-0"> Sun</label>
          <label class="fc-day-chip"><input type="checkbox" value="1" id="fc-rd-1"> Mon</label>
          <label class="fc-day-chip"><input type="checkbox" value="2" id="fc-rd-2"> Tue</label>
          <label class="fc-day-chip"><input type="checkbox" value="3" id="fc-rd-3"> Wed</label>
          <label class="fc-day-chip"><input type="checkbox" value="4" id="fc-rd-4"> Thu</label>
          <label class="fc-day-chip"><input type="checkbox" value="5" id="fc-rd-5"> Fri</label>
          <label class="fc-day-chip"><input type="checkbox" value="6" id="fc-rd-6"> Sat</label>
        </div>
        <div style="font-size:9px;font-weight:700;color:var(--chd);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.4px">Every how many weeks?</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <label class="fc-day-chip"><input type="radio" name="fc-week-interval" value="1" id="fc-wi-1" checked> Every week</label>
          <label class="fc-day-chip"><input type="radio" name="fc-week-interval" value="2" id="fc-wi-2"> Every 2 weeks</label>
          <label class="fc-day-chip"><input type="radio" name="fc-week-interval" value="3" id="fc-wi-3"> Every 3 weeks</label>
          <label class="fc-day-chip"><input type="radio" name="fc-week-interval" value="4" id="fc-wi-4"> Every 4 weeks</label>
        </div>
        <div style="font-size:9px;color:var(--tmut);margin-top:.4rem;font-style:italic">e.g. check Fri + Every 2 weeks = every other Friday 🎀</div>
      </div>

      <div class="fr">
        <label class="fl">Notes</label>
        <textarea class="inp inp-full" id="fc-ev-notes" placeholder="Details, location, links..." style="height:60px;resize:none"></textarea>
      </div>

      <div style="display:flex;gap:7px;margin-top:.4rem">
        <button class="btn btn-red" style="flex:1" onclick="fcSaveEvent()">Save event ✓</button>
        <button class="btn btn-outline" id="fc-delete-btn" style="display:none;border-color:var(--ch);color:var(--ch)" onclick="fcDeleteEvent()">Delete</button>
        <button class="btn btn-outline" onclick="document.getElementById('fc-event-modal').classList.remove('open')">Cancel</button>
      </div>
    </div>
  </div>

</div>
<script type="module" src="shared.js"></script>
<script type="module" src="calendar.js"></script>
</body>
</html>
