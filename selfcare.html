<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💄 Self Care — Weird Girl Dashboard</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="selfcare.css">
</head>
<body>
<nav class="nav" id="main-nav"></nav>
<div class="db">
<div class="page-title">💄 Self Care & Beauty</div>

<div class="g2" style="margin-top:1rem">
  <div class="card"><div class="ct"><div class="ci">🌅</div>Morning rituals</div><div id="rituals-morning"></div></div>
  <div class="card"><div class="ct"><div class="ci">🌙</div>Evening rituals</div><div id="rituals-evening"></div></div>
</div>
<div class="g2">
  <div class="card"><div class="ct"><div class="ci">💅</div>Treatment tracker</div>
    <div class="row"><input class="inp" id="treatment-inp" placeholder="e.g. blowout, wax, facial..." style="flex:1"><button class="btn btn-red" id="treatment-add-btn">Log it</button></div>
    <div id="treatment-log" style="margin-top:.5rem;max-height:180px;overflow-y:auto"></div>
  </div>
  <div class="card"><div class="ct"><div class="ci">👗</div>Outfit log</div>
    <div class="row"><input class="inp" id="outfit-inp" placeholder="Describe the look..." style="flex:1"><button class="btn btn-red" id="outfit-add-btn">Log it</button></div>
    <div id="outfit-log" style="margin-top:.5rem;max-height:180px;overflow-y:auto"></div>
  </div>
</div>
<div class="card"><div class="ct"><div class="ci">🧴</div>Skincare routine</div><div id="skincare-grid"></div></div>
<div class="card pink-acc"><div class="ct"><div class="ci">✨</div>Beauty goals</div>
  <div class="row"><input class="inp" id="bg-inp" placeholder="A beauty goal..." style="flex:1"><button class="btn btn-red" id="bg-add">Add</button></div>
  <div id="bg-list" style="margin-top:.5rem"></div>
</div>
</div>

<script type="module" src="shared.js"></script>
<script type="module" src="selfcare.js"></script>
</body>
</html>
