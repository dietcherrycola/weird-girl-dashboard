<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Energy — Weird Girl Dashboard</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="energy.css">
</head>
<body>
<nav class="nav" id="main-nav"></nav>
<div class="db">
<div class="page-title">⚡ Energy Tracker</div>
<div class="page-sub">Track your physical and mental energy patterns</div>

<div class="g2" style="margin-top:1rem">
  <!-- LOG ENERGY -->
  <div class="card">
    <div class="ct"><div class="ci">⚡</div>Log today's energy</div>
    <div class="energy-compact">
      <div class="ec-panel"><div class="ec-title"><div class="ec-dot" style="background:var(--orange)"></div>Physical energy</div><div class="ec-opts" id="phys-opts"></div></div>
      <div class="ec-panel"><div class="ec-title"><div class="ec-dot" style="background:var(--purple)"></div>Mental energy</div><div class="ec-opts" id="mental-opts"></div></div>
    </div>
    <textarea class="inp inp-full" id="energy-notes" placeholder="Optional notes — what affected your energy today?" style="height:50px;margin-top:.5rem;resize:none"></textarea>
    <button class="btn btn-red" style="width:100%;margin-top:.5rem" id="energy-log-btn">Log today's energy</button>
    <div style="font-size:10px;color:var(--green);text-align:center;margin-top:4px;min-height:14px;font-style:italic" id="energy-saved"></div>
  </div>

  <!-- ENERGY TIPS -->
  <div class="card blue-acc">
    <div class="ct"><div class="ci">💡</div>Energy insights</div>
    <div id="energy-insights" style="font-size:11px;line-height:1.6;color:var(--tm)"></div>
  </div>
</div>

<!-- HOURLY TRACKING -->
<div class="card">
  <div class="ct"><div class="ci">🕐</div>Hourly energy map<span style="font-size:9px;color:var(--tmut);font-family:'DM Sans',sans-serif;font-weight:400;margin-left:6px">Click a time slot to log</span></div>
  <div class="hour-grid" id="hour-grid"></div>
  <div class="sdiv"></div>
  <div style="font-size:9px;color:var(--tmut);margin-bottom:4px">Today's pattern</div>
  <div class="hour-chart" id="hour-chart"></div>
  <div style="display:flex;gap:10px;font-size:9px;color:var(--tmut)">
    <span>🟠 Physical</span><span>🟣 Mental</span>
  </div>
</div>

<!-- TRENDS -->
<div class="card">
  <div class="ct"><div class="ci">📈</div>Energy trends (last 14 days)</div>
  <div id="energy-trends"></div>
</div>

<!-- HISTORY -->
<div class="card">
  <div class="ct"><div class="ci">📋</div>Full history</div>
  <div id="energy-history" style="max-height:300px;overflow-y:auto"></div>
</div>

</div>

<script type="module" src="shared.js"></script>
<script type="module" src="energy.js"></script>
</body>
</html>
