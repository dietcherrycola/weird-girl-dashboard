<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Done Stats — Weird Girl Dashboard</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="done-stats.css">
</head>
<body>
<nav class="nav" id="main-nav"></nav>
<div class="db">
<a href="index.html" class="back-link">← Back to Dashboard</a>
<div style="text-align:center;margin-bottom:1.2rem">
  <div style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--chd)">Done Stats</div>
  <div style="font-size:11px;color:var(--tmut);letter-spacing:2px;text-transform:uppercase;margin-top:4px">Everything you've accomplished</div>
</div>

<div class="ds-stats" id="ds-stats"></div>

<div class="card"><div class="ct"><div class="ci">+</div>This month daily completions</div>
<div class="month-bar" id="ds-month-graph"></div></div>

<div class="card"><div class="ct"><div class="ci">*</div>What you work on most</div>
<div id="ds-keywords" style="display:flex;flex-wrap:wrap;gap:2px"></div></div>

<div class="card"><div class="ct"><div class="ci">-</div>Day-by-day archive</div>
<div id="ds-archive"></div>
<div style="text-align:center;margin-top:.5rem"><button class="btn btn-outline" id="ds-load-more" style="font-size:10px">Load more</button></div></div>

</div>
<script type="module" src="shared.js"></script>
<script type="module" src="done-stats.js"></script>
</body>
</html>
